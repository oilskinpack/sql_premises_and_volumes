# --- Секция с метаданными для Poetry ---
[tool.poetry]
name = "sql-premises-and_volumes"
version = "0.1.0"
description = "Выгрузка данных из бим источником"
authors = ["n.khabarov <your@email.com>"]
readme = "README.md"

# --- ВОТ ГЛАВНОЕ ИЗМЕНЕНИЕ ---
packages = [
    { include = "Helpers" },
    { include = "Volumes" },
    { include = "Premises" }
]

# --- Секция с зависимостями ---
[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pandas = ">=2.3.2,<3.0.0"
scikit-learn = ">=1.7.2,<2.0.0"
numpy = ">=2.3.3,<3.0.0"
openpyxl = ">=3.1.5,<4.0.0"

# --- Эта секция остается без изменений ---
ipykernel = "^6.30.1"
kafka = "^1.3.5"
seaborn = "^0.13.2"
kafka-python-ng = "^2.2.3"
sqlalchemy = "^2.0.49"
pycryptodome = "^3.23.0"
pycryptodomex = "^3.23.0"
psycopg2 = "^2.9.12"


[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"